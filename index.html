<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Study World Map · Aprende los países del mundo jugando</title>
    <meta
      name="description"
      content="Mapamundi interactivo en 3D y 2D para estudiar los países del mundo, sus capitales y sus banderas. Juega, falla, repasa y aprende geografía a tu ritmo."
    />
    <meta name="theme-color" content="#f1eadb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1520" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Study World Map · Aprende los países del mundo jugando" />
    <meta
      property="og:description"
      content="Globo 3D y mapa plano interactivos para estudiar países, capitales y banderas."
    />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://www.studyworldmap.com/" />
    <meta property="og:image" content="https://www.studyworldmap.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Globo terráqueo con los países coloreados junto al panel de retos de Study World Map" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.studyworldmap.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee.
      try {
        var saved = JSON.parse(localStorage.getItem('mapamundi:ajustes') || '{}');
        var theme = (saved.state && saved.state.theme) || 'auto';
        if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper';
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'paper';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Study World Map necesita JavaScript para mostrar el mapa interactivo y los juegos de geografía.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
