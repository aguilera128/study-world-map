name: CI

on:
  push:
    branches: [main]
  pull_request:

# El flujo solo lee el código: ni escribe en el repositorio ni usa secretos.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Las acciones van fijadas por commit; la versión, en el comentario.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toma la versión de pnpm del campo packageManager de package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build genera el atlas que necesitan las pruebas y comprueba tipos (tsc). No hay linter.
      # Sin variables de entorno, como lo compila quien clona el repositorio.
      - run: pnpm build
      - run: pnpm test
